<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - BiomeXplore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #333; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .admin-header { 
            background: #1e3a8a; 
            color: white; 
            padding: 20px 0; 
            margin-bottom: 30px;
        }
        
        /* Login Form */
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .login-form button {
            width: 100%;
            padding: 12px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        
        /* Dashboard */
        .dashboard { display: none; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tab { 
            padding: 10px 20px; 
            background: #e2e8f0; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
        }
        .nav-tab.active { background: #1e40af; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Forms */
        .management-form { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        .management-form input, 
        .management-form textarea,
        .management-form select { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0 15px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
        }
        .management-form textarea { height: 120px; }
        
        /* Lists */
        .management-list { background: white; padding: 20px; border-radius: 8px; }
        .management-item { 
            padding: 15px; 
            border: 1px solid #e2e8f0; 
            border-radius: 4px; 
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-content { flex: 1; }
        .item-actions button { 
            margin-left: 10px; 
            padding: 5px 10px; 
            border: none; 
            border-radius: 3px; 
            cursor: pointer;
            font-size: 12px;
        }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-logo { background: #10b981; color: white; }
        
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
        
        /* Partner specific styles */
        .partner-logo-preview {
            max-width: 150px;
            max-height: 80px;
            object-fit: contain;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 5px;
        }
        
        .partner-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .partner-logo-small {
            width: 60px;
            height: 40px;
            object-fit: contain;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 2px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .management-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .item-actions {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <h1>BiomeXplore Admin Panel</h1>
        </div>
    </div>

    <div class="container">
        <!-- Login Form -->
        <div id="loginSection" class="login-form">
            <h2>Admin Login</h2>
            <form id="loginForm">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div id="loginMessage"></div>
            <p style="margin-top: 20px; font-size: 12px; color: #666;">
                Default credentials: admin / biomexplore2025
            </p>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Welcome, <span id="adminUsername"></span>!</h2>
                <button onclick="logout()" style="padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Logout
                </button>
            </div>

            <div class="nav-tabs">
                <button class="nav-tab active" onclick="showTab('news')">News Management</button>
                <button class="nav-tab" onclick="showTab('partners')">Partners Management</button>
            </div>

            <!-- News Management Tab -->
            <div id="newsTab" class="tab-content active">
                <div class="management-form">
                    <h3>Create New Article</h3>
                    <form id="newsForm">
                        <input type="text" name="title" placeholder="Article Title" required>
                        <textarea name="content" placeholder="Article Content" required></textarea>
                        <input type="text" name="image_url" placeholder="Image URL (optional)">
                        <button type="submit" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            Create Article
                        </button>
                    </form>
                </div>
                <div id="newsMessage"></div>
                <div class="management-list">
                    <h3>Existing Articles</h3>
                    <div id="newsList"></div>
                </div>
            </div>

            <!-- Partners Management Tab -->
            <div id="partnersTab" class="tab-content">
                <div class="management-form">
                    <h3 id="partnerFormTitle">Add New Partner</h3>
                    <!-- REMOVI o enctype="multipart/form-data" -->
                    <form id="partnerForm">
                        <input type="hidden" id="partnerId" name="id">
                        <div class="form-grid">
                            <div>
                                <label>Partner Name *</label>
                                <input type="text" id="partnerName" name="name" placeholder="Enter partner name" required>
                            </div>
                            <div>
                                <label>Website</label>
                                <input type="url" id="partnerWebsite" name="website" placeholder="https://example.com">
                            </div>
                            <div class="full-width">
                                <label>Description</label>
                                <textarea id="partnerDescription" name="description" placeholder="Partner description"></textarea>
                            </div>
                            <!-- COMENTEI TEMPORARIAMENTE O UPLOAD DE LOGO -->
                            <!--
                            <div class="full-width">
                                <label>Logo</label>
                                <input type="file" id="partnerLogo" name="logo" accept="image/*">
                                <small style="color: #666;">Supported formats: JPG, PNG, WEBP. Max size: 5MB</small>
                                <div id="currentLogoPreview"></div>
                            </div>
                            -->
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button type="submit" id="partnerSubmitBtn" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                Add Partner
                            </button>
                            <button type="button" onclick="resetPartnerForm()" style="padding: 10px 20px; background: #6b7280; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
                <div id="partnersMessage"></div>
                <div class="management-list">
                    <h3>Existing Partners</h3>
                    <div id="partnersList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication on page load
        checkAuth();

        // Global variables
        let currentEditingPartnerId = null;

        async function checkAuth() {
            try {
                const response = await fetch('./api/admin/check-auth'); // ✅ MUDADO: ./api/admin/check-auth
                const data = await response.json();
                
                if (data.isAuthenticated) {
                    showDashboard(data.username);
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('./api/admin/login', { // ✅ MUDADO: ./api/admin/login
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const messageDiv = document.getElementById('loginMessage');

                if (result.success) {
                    showDashboard(result.username);
                } else {
                    messageDiv.innerHTML = `<div class="message error">${result.error}</div>`;
                }
            } catch (error) {
                document.getElementById('loginMessage').innerHTML = 
                    '<div class="message error">Login failed. Please try again.</div>';
            }
        });

        function showDashboard(username) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('adminUsername').textContent = username;
            loadNews();
            loadPartners();
        }

        async function logout() {
            try {
                await fetch('./api/admin/logout', { method: 'POST' }); // ✅ MUDADO: ./api/admin/logout
                location.reload();
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }

        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        // ============ NEWS MANAGEMENT ============

        async function loadNews() {
            try {
                const response = await fetch('./api/admin/news'); // ✅ MUDADO: ./api/admin/news
                const news = await response.json();
                
                const newsList = document.getElementById('newsList');
                newsList.innerHTML = news.map(article => `
                    <div class="management-item">
                        <div class="item-content">
                            <h4>${article.title}</h4>
                            <p style="color: #666; font-size: 14px;">${article.content.substring(0, 100)}...</p>
                            <small style="color: #999;">Created: ${new Date(article.created_at).toLocaleDateString()}</small>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" onclick="editNews(${article.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteNews(${article.id})">Delete</button>
                        </div>
                    </div>
                `).join('') || '<p>No articles yet.</p>';
            } catch (error) {
                console.error('Error loading news:', error);
            }
        }

        document.getElementById('newsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('./api/admin/news', { // ✅ MUDADO: ./api/admin/news
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const messageDiv = document.getElementById('newsMessage');

                if (result.success) {
                    messageDiv.innerHTML = `<div class="message success">${result.message}</div>`;
                    e.target.reset();
                    loadNews();
                } else {
                    messageDiv.innerHTML = `<div class="message error">${result.error}</div>`;
                }

                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 5000);
            } catch (error) {
                document.getElementById('newsMessage').innerHTML = 
                    '<div class="message error">Error creating article. Please try again.</div>';
            }
        });

        async function deleteNews(id) {
            if (!confirm('Are you sure you want to delete this article?')) return;

            try {
                const response = await fetch(`./api/admin/news/${id}`, { // ✅ MUDADO: ./api/admin/news/${id}
                    method: 'DELETE'
                });

                const result = await response.json();
                
                if (result.success) {
                    loadNews();
                } else {
                    alert('Error deleting article: ' + result.error);
                }
            } catch (error) {
                alert('Error deleting article. Please try again.');
            }
        }

        function editNews(id) {
            alert('Edit functionality coming soon! Article ID: ' + id);
        }

        // ============ PARTNERS MANAGEMENT ============

        async function loadPartners() {
            try {
                console.log('🔄 Loading partners for admin...');
                const response = await fetch('./api/admin/partners'); // ✅ MUDADO: ./api/admin/partners
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const partners = await response.json();
                console.log('📋 Partners loaded:', partners);
                
                const partnersList = document.getElementById('partnersList');
                
                if (!partners || partners.length === 0) {
                    partnersList.innerHTML = '<p>No partners yet. Add your first partner above!</p>';
                    return;
                }
                
                partnersList.innerHTML = partners.map(partner => `
                    <div class="management-item">
                        <div class="item-content">
                            <div class="partner-item">
                                <div style="width: 60px; height: 40px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #64748b; border-radius: 4px; font-size: 10px;">
                                    Logo
                                </div>
                                <div>
                                    <h4>${partner.name}</h4>
                                    <p style="color: #666; font-size: 14px; margin: 5px 0;">${partner.description || 'No description'}</p>
                                    ${partner.website ? `<a href="${partner.website}" target="_blank" style="color: #3b82f6; font-size: 12px;">${partner.website}</a>` : ''}
                                    <small style="color: #999;">ID: ${partner.id}</small>
                                </div>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" onclick="editPartner(${partner.id})">Edit</button>
                            <button class="btn-delete" onclick="deletePartner(${partner.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('❌ Error loading partners:', error);
                document.getElementById('partnersList').innerHTML = 
                    '<p class="message error">Error loading partners. Check console for details.</p>';
            }
        }

        // Partner Form Submission - VERSÃO CORRIGIDA
        document.getElementById('partnerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('📝 Submitting partner form...');
            
            const partnerId = document.getElementById('partnerId').value;
            const name = document.getElementById('partnerName').value;
            const website = document.getElementById('partnerWebsite').value;
            const description = document.getElementById('partnerDescription').value;
            
            // Validação básica
            if (!name.trim()) {
                document.getElementById('partnersMessage').innerHTML = 
                    '<div class="message error">Partner name is required</div>';
                return;
            }
            
            const data = {
                name: name.trim(),
                website: website.trim(),
                description: description.trim()
            };
            
            console.log('📤 Sending data:', data);
            
            try {
                let response;
                let url;
                let method;
                
                if (partnerId) {
                    // Update existing partner
                    url = `./api/admin/partners/${partnerId}`; // ✅ MUDADO: ./api/admin/partners/${partnerId}
                    method = 'PUT';
                } else {
                    // Create new partner
                    url = './api/admin/partners'; // ✅ MUDADO: ./api/admin/partners
                    method = 'POST';
                }
                
                response = await fetch(url, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                console.log('📥 Response status:', response.status);
                const result = await response.json();
                console.log('📥 Response data:', result);
                
                const messageDiv = document.getElementById('partnersMessage');
                
                if (response.ok) {
                    messageDiv.innerHTML = `<div class="message success">${result.message}</div>`;
                    resetPartnerForm();
                    loadPartners();
                } else {
                    messageDiv.innerHTML = `<div class="message error">${result.error}</div>`;
                }
                
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 5000);
                
            } catch (error) {
                console.error('❌ Error saving partner:', error);
                document.getElementById('partnersMessage').innerHTML = 
                    '<div class="message error">Network error. Please check your connection and try again.</div>';
            }
        });

        // Edit Partner
        async function editPartner(id) {
            try {
                console.log('✏️ Editing partner:', id);
                const response = await fetch('./api/admin/partners'); // ✅ MUDADO: ./api/admin/partners
                const partners = await response.json();
                const partner = partners.find(p => p.id === id);
                
                if (!partner) {
                    alert('Partner not found');
                    return;
                }
                
                // Fill the form
                document.getElementById('partnerId').value = partner.id;
                document.getElementById('partnerName').value = partner.name;
                document.getElementById('partnerWebsite').value = partner.website || '';
                document.getElementById('partnerDescription').value = partner.description || '';
                document.getElementById('partnerFormTitle').textContent = 'Edit Partner';
                document.getElementById('partnerSubmitBtn').textContent = 'Update Partner';
                
                currentEditingPartnerId = id;
                
                console.log('✅ Form filled with partner data:', partner);
                
            } catch (error) {
                console.error('❌ Error loading partner for editing:', error);
                alert('Error loading partner data');
            }
        }

        // Update Partner Logo - FUNÇÃO SIMPLIFICADA
        function updatePartnerLogo(partnerId) {
            alert('Logo upload functionality coming soon! Partner ID: ' + partnerId);
        }

        // Delete Partner
        async function deletePartner(partnerId) {
            if (!confirm('Are you sure you want to delete this partner? This action cannot be undone.')) {
                return;
            }
            
            try {
                console.log('🗑️ Deleting partner:', partnerId);
                const response = await fetch(`./api/admin/partners/${partnerId}`, { // ✅ MUDADO: ./api/admin/partners/${partnerId}
                    method: 'DELETE'
                });
                
                const result = await response.json();
                console.log('🗑️ Delete response:', result);
                
                if (response.ok) {
                    alert('Partner deleted successfully!');
                    loadPartners();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('❌ Error deleting partner:', error);
                alert('Error deleting partner');
            }
        }

        // Reset Partner Form
        function resetPartnerForm() {
            document.getElementById('partnerForm').reset();
            document.getElementById('partnerId').value = '';
            document.getElementById('partnerFormTitle').textContent = 'Add New Partner';
            document.getElementById('partnerSubmitBtn').textContent = 'Add Partner';
            document.getElementById('currentLogoPreview').innerHTML = '';
            currentEditingPartnerId = null;
            console.log('🔄 Partner form reset');
        }
    </script>
</body>
</html>
